name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Ruff
        run: uv run --python ${{ matrix.python-version }} --extra dev ruff check .
      - name: Tests
        run: uv run --python ${{ matrix.python-version }} --extra dev pytest -q --cov=mcqaudit --cov-report=term
